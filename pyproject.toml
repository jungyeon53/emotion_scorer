[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion_scorer"
version = "0.1.0"
description = "Emotion scorer for TTS output (ESD, WavLM features)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyarrow",
    "scipy",
    "soundfile",
    "torch",
    "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
